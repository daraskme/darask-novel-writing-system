# 章ビート。章の設計であって本文の下書きではない。ID は bible/ と plot/foreshadowing.toml を参照する。
# 全体→章→1回の本文生成用の小場面へ具体化する。[[scenes]] の順に、一度に一小場面を書く。
# 概ね800〜2000字を目安とし、自然な区切りを優先する。短い繋ぎを800字まで膨らませない。
# 同じ物語上の場面を複数の生成区間にしてよい。分割のためだけに時刻・場所・視点を変えない。
# 「例:」は見本作『索道日誌』第 3 章。

chapter = {{CHAPTER}}
title = "{{CHAPTER_TITLE}}"   # 例: "四月十九日の欄"
pov = ""                      # 例: "C01"
characters = []               # 例: ["C01", "C02"]
locations = []                # 例: ["L01"]
intent = ""                   # この章で何を変えるか。例: "ちづるが初めて所長に嘘をつく。読者に、もう引き返せないと思わせる"
reader_should = []            # 読後に読者が知る・感じる・気になること。盲検読者の再話と照合する
                              # 例: ["筆跡が祖父のものだと知る", "報告しなかったことに引っかかる", "所長は気づいているのかが気になる"]
intensity = 0                 # 0-100。plan/structure.md の表と同じ値。例: 55
ending_type = ""              # 例: "行為"。canon/endings.logと同じ短い型名。反復は意図を確認し、機械的に交互にしない
plant = []                    # この章で張る伏線。例: ["F002"]
touch = []                    # 触れ直す伏線。例: ["F001"]
payoff = []                   # 回収する伏線

[[scenes]]
id = "s01"                   # 章内で一意の安定ID。配列順が執筆順。並べ替えでIDを振り直さない
target_chars = 1200          # この小場面の概算字数。正の整数。未設定なら省略する。厳密な下限/上限ではない
title = ""                    # 例: "機械室、朝の点検"
location = ""                 # 例: "L01"
time = ""                     # 例: "二月第二週の月曜、朝七時"
pov = ""                      # 例: "C01"
characters = []               # 例: ["C01", "C02"]
goal = ""                     # 視点人物がこの場面で欲しいもの。例: "日誌を所長に見られずに書庫へ戻す"
conflict = ""                 # それを阻むもの。例: "所長が先に来ていて、日誌を探している"
change = ""                   # 場面の前後で変わること。例: "ちづるは『まだ書いていません』と嘘をつく"
anchor = ""                   # 関心の錨。例: "所長の手の中の鍵束"
knowledge = ""                # 誰が何を知り、何を知らないか。例: "ちづる: 筆跡は祖父のものだと確信。所長: 日誌が一晩無かったことだけ知っている。鍵の欠けは二人とも未認識"
entry_state = ""             # 開始状態。例: "日誌はちづるの鞄。所長は機械室で日誌を探している"
exit_state = ""              # 終了状態。例: "日誌は鞄のまま。ちづるは嘘をつき、所長から点検を指示された"
handoff = ""                 # 次への接続。例: "s02: 指示への応答から同じ機械室で点検を始める。入室や日誌の説明を繰り返さない"
direction = ""                # 演出の指示。例: "鍵の本数は誰にも数えさせない。読者にだけ二本に見えるように置く"

# 小場面を足すときは [[scenes]] の塊を複製し、未使用のid（s02等）を付ける。
# id / target_chars / entry_state / exit_state / handoff は追加の任意フィールド。ない既存ビートも有効。
# target_chars の合計を章・作品全体の字数条件と照合する。未設定分を0字と数えず、暫定の配分とする。
# 出口と次の入口を繋ぎ、最後のhandoffには章・作品で閉じることを記してよい。
# 原稿を組み上げた後の繋がり・重複・文体・配分と大局的な調整は検証・推敲で行う。
